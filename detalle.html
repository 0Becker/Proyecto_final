<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #111827;
        }

        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        /* PRODUCT DETAIL CORRECTIONS */
        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,.06);
            margin-bottom: 50px;
        }

        .product-image-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
            border-radius: 20px;
            padding: 30px;
            height: 450px;
        }

        .product-image-wrap img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-category {
            font-size: 14px;
            text-transform: uppercase;
            color: #6366f1;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .product-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .product-price {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 25px;
        }

        .product-description {
            font-size: 16px;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .actions-btn {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 16px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: .2s;
            border: none;
        }

        .btn-primary {
            background: #6366f1;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: #4f46e5;
        }

        .btn-secondary {
            background: white;
            border: 2px solid #e5e7eb;
            color: #4b5563;
        }

        .btn-secondary:hover {
            border-color: #6366f1;
            color: #6366f1;
        }

        /* RELATED PRODUCTS */
        .related-section {
            margin-top: 60px;
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,.03);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .card-img-wrap {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            background: #f9fafb;
            border-radius: 15px;
            padding: 10px;
        }

        .card-img-wrap img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 40px;
        }

        .card-price {
            font-size: 16px;
            font-weight: bold;
            color: #111827;
        }
    </style>
</head>
<body>
<nav style="background: #0f172a; padding: 20px 0; position: sticky; top: 0; z-index: 100;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center;">
    <div style="font-size: 24px; font-weight: 700; color: white; cursor: pointer; font-family: 'Inter', sans-serif;" onclick="window.location.href='index.html'">
      Mini<span style="color: #6119e8;">Shop</span>
    </div>
  </div>
</nav>
    <div class="container">
        <main class="product-detail" id="productDetailContainer">
            <p style="text-align: center; grid-column: 1/-1;">Cargando detalles del producto...</p>
        </main>

        <section class="related-section">
            <h2 class="section-title">Productos relacionados</h2>
            <div class="products-grid" id="relatedProductsContainer">
                </div>
        </section>
    </div>
<footer style="background: #0f172a; color: white; padding: 30px 0; margin-top: 60px; text-align: center; width: 100%; clear: both; font-family: 'Inter', sans-serif;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
    <p style="font-size: 18px; font-weight: bold; margin-bottom: 10px; cursor: pointer; display: inline-block;" onclick="window.location.href='index.html'">
      Mini<span style="color: #6119e8;">Shop</span>
    </p>
    <p style="color: #64748b; font-size: 14px;">&copy; 2026 Todos los derechos reservados.</p>
  </div>
</footer>
    <script>

        function getProductId() {
        
            return localStorage.getItem("selectedProductId") || "1";
        }

        async function getProduct(id) {
            try {
                const res = await fetch(`https://fakestoreapi.com/products/${id}`);
                if (!res.ok) throw new Error("No se pudo obtener el producto");
                return await res.json();
            } catch (error) {
                console.error("Error en getProduct:", error);
                return null;
            }
        }

        function renderProduct(product) {
            const contenedor = document.getElementById("productDetailContainer");
            if (!contenedor || !product) return;

            contenedor.innerHTML = `
                <div class="product-image-wrap">
                    <img src="${product.image}" alt="${product.title}">
                </div>
                <div class="product-info">
                    <p class="product-category">${product.category}</p>
                    <h1 class="product-title">${product.title}</h1>
                    <p class="product-price">${product.price} €</p>
                    <p class="product-description">${product.description}</p>
                    <div class="actions-btn">
                        <button class="btn btn-primary" id="btnAddToCart">Añadir al carrito</button>
                        <button class="btn btn-secondary" id="btnAddToFav">❤️ Favorito</button>
                    </div>
                </div>
            `;

            document.getElementById("btnAddToCart").addEventListener("click", () => {
                alert(`"${product.title}" se ha añadido al carrito.`);
            });

            document.getElementById("btnAddToFav").addEventListener("click", () => {
                alert(`"${product.title}" se ha guardado en tus favoritos.`);
            });
        }

        async function getRelatedProducts(category) {
            try {
                const res = await fetch(`https://fakestoreapi.com/products/category/${category}`);
                if (!res.ok) throw new Error("No se pudieron cargar los productos relacionados");
                return await res.json();
            } catch (error) {
                console.error("Error en getRelatedProducts:", error);
                return [];
            }
        }

        function renderRelatedProducts(products, currentProductId) {
            const contenedor = document.getElementById("relatedProductsContainer");
            if (!contenedor) return;

            contenedor.innerHTML = "";

            const relacionadosFiltrados = products
                .filter(p => p.id !== parseInt(currentProductId))
                .slice(0, 4);

            if (relacionadosFiltrados.length === 0) {
                contenedor.innerHTML = `<p style="grid-column: 1/-1; color: #6b7280;">No hay más productos en esta categoría.</p>`;
                return;
            }

            relacionadosFiltrados.forEach(prod => {
                const card = document.createElement("article");
                card.classList.add("product-card");
                
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${prod.image}" alt="${prod.title}">
                    </div>
                    <h3 class="card-title" title="${prod.title}">${prod.title}</h3>
                    <p class="card-price">${prod.price} €</p>
                `;

                card.addEventListener("click", () => {
                    localStorage.setItem("selectedProductId", prod.id);
                    window.location.reload();
                });

                contenedor.appendChild(card);
            });
        }

    
        async function init() {
            const idProducto = getProductId();

            const producto = await getProduct(idProducto);

            if (producto) {
                renderProduct(producto);

                const productosRelacionados = await getRelatedProducts(producto.category);

                renderRelatedProducts(productosRelacionados, idProducto);
            } else {
                document.getElementById("productDetailContainer").innerHTML = 
                    `<p style="text-align: center; grid-column: 1/-1; color: red;">Error al cargar el producto. Inténtalo de nuevo.</p>`;
            }
        }

  
        init();
    </script>
</body>
</html>
