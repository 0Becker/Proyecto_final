<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Panel Administración
</title>

<style>

/* ===================================
   RESET
=================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#111827;
}

/* ===================================
   LAYOUT
=================================== */

.container{
    max-width:1500px;
    margin:40px auto;
    padding:0 20px;
}

/* ===================================
   HEADER
=================================== */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.logo{
    font-size:38px;
    font-weight:bold;
}

.logo span{
    color:#6366f1;
}

.add-btn{
    border:none;
    background:#6366f1;
    color:white;
    padding:16px 24px;
    border-radius:18px;
    font-weight:bold;
    cursor:pointer;
}

/* ===================================
   STATS
=================================== */

.stats{
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:25px;
    margin-bottom:35px;
}

.stat-card{
    background:white;
    padding:30px;
    border-radius:28px;
    box-shadow: 0 15px 40px rgba(0,0,0,.05);
}

.stat-card h2{
    font-size:40px;
    margin-bottom:10px;
}

.stat-card p{
    color:#6b7280;
}

/* ===================================
   FILTERS
=================================== */

.filters{
    background:white;
    border-radius:28px;
    padding:25px;
    margin-bottom:30px;
    display:flex;
    gap:20px;
}

.filters input{
    flex:1;
    padding:16px;
    border-radius:14px;
    border:1px solid #dbe3ee;
}

/* ===================================
   TABLE
=================================== */

.table-container{
    background:white;
    border-radius:28px;
    padding:30px;
    box-shadow: 0 15px 40px rgba(0,0,0,.05);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    padding:20px;
    color:#64748b;
}

td{
    padding:20px;
    border-top:1px solid #edf2f7;
    vertical-align: middle;
}

.product-image{
    width:70px;
    height:70px;
    object-fit:contain;
}

.actions{
    display:flex;
    gap:10px;
}

.edit-btn{
    border:none;
    background:#dbeafe;
    color:#1d4ed8;
    padding:10px 16px;
    border-radius:12px;
    cursor:pointer;
}

.delete-btn{
    border:none;
    background:#fee2e2;
    color:#dc2626;
    padding:10px 16px;
    border-radius:12px;
    cursor:pointer;
}

/* ===================================
   MODAL
=================================== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none; 
    justify-content:center;
    align-items:center;
    z-index: 1000;
}

.modal.active {
    display: flex;
}

.modal-content{
    width:500px;
    background:white;
    border-radius:28px;
    padding:35px;
    position: relative;
}

.close-modal-btn {
    position: absolute;
    top: 20px;
    right: 25px;
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #6b7280;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
}

.form-group input{
    padding:16px;
    border-radius:14px;
    border:1px solid #dbe3ee;
}

.save-btn{
    width:100%;
    border:none;
    background:#10b981;
    color:white;
    padding:16px;
    border-radius:14px;
    font-weight:bold;
    cursor:pointer;
}

/* ===================================
   RESPONSIVE
=================================== */

@media(max-width:1100px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr;
    }
    .filters{
        flex-direction:column;
    }
}

</style>

</head>

<body>
<nav style="background: #0f172a; padding: 20px 0; position: sticky; top: 0; z-index: 100;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center;">
    <div style="font-size: 24px; font-weight: 700; color: white; cursor: pointer; font-family: 'Inter', sans-serif;" onclick="window.location.href='index.html'">
      Mini<span style="color: #6119e8;">Shop</span>
    </div>
  </div>
</nav>
<div class="container">

    <header class="header">
        <div class="logo">
            Nova<span>Shop</span> Admin
        </div>
        <button
            class="add-btn"
            id="addProductBtn"
        >
            Nuevo producto
        </button>
    </header>

    <section class="stats">
        <article class="stat-card">
            <h2 id="totalProducts">0</h2>
            <p>Productos</p>
        </article>

        <article class="stat-card">
            <h2 id="totalUsers">0</h2>
            <p>Usuarios</p>
        </article>

        <article class="stat-card">
            <h2 id="totalOrders">0</h2>
            <p>Pedidos</p>
        </article>

        <article class="stat-card">
            <h2 id="totalSales">0€</h2>
            <p>Ventas (Valor Inventario)</p>
        </article>
    </section>

    <section class="filters">
        <input
            type="text"
            id="searchInput"
            placeholder="Buscar producto por título o categoría..."
        >
    </section>

    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Categoría</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="productsTable">
                </tbody>
        </table>
    </section>

</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <button class="close-modal-btn" id="closeModalBtn">&times;</button>
        <h2 id="modalTitle" style="margin-bottom: 20px;">Producto</h2>

        <form id="productForm">
            <div class="form-group">
                <label for="title">Título</label>
                <input type="text" id="title" required>
            </div>

            <div class="form-group">
                <label for="price">Precio</label>
                <input type="number" step="0.01" id="price" required>
            </div>

            <div class="form-group">
                <label for="category">Categoría</label>
                <input type="text" id="category" required>
            </div>

            <div class="form-group">
                <label for="image">URL de la Imagen</label>
                <input type="url" id="image" placeholder="https://ejemplo.com/imagen.jpg">
            </div>

            <button class="save-btn" type="submit">
                Guardar
            </button>
        </form>
    </div>
</div>
<footer style="background: #0f172a; color: white; padding: 30px 0; margin-top: 60px; text-align: center; width: 100%; clear: both; font-family: 'Inter', sans-serif;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
    <p style="font-size: 18px; font-weight: bold; margin-bottom: 10px; cursor: pointer; display: inline-block;" onclick="window.location.href='index.html'">
      Mini<span style="color: #6119e8;">Shop</span>
    </p>
    <p style="color: #64748b; font-size: 14px;">&copy; 2026 Todos los derechos reservados.</p>
  </div>
</footer>
<script>

let products = [];
let editingId = null;


async function getProducts() {
    try {
        const res = await fetch("https://fakestoreapi.com/products");
        if (!res.ok) throw new Error("Error fetching products");
        products = await res.json();
        
        renderProducts();
        renderStats();
    } catch (error) {
        console.error("Error en getProducts:", error);
    }
}

function renderProducts() {
    const tableBody = document.getElementById("productsTable");
    if (!tableBody) return;
    tableBody.innerHTML = "";

    const busqueda = document.getElementById("searchInput")?.value.toLowerCase().trim() || "";
    
    const filtrados = products.filter(p => 
        p.title.toLowerCase().includes(busqueda) || 
        p.category.toLowerCase().includes(busqueda)
    );

    if (filtrados.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px; color: #6b7280;">No se encontraron productos</td></tr>`;
        return;
    }

    filtrados.forEach(prod => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>
                <img src="${prod.image}" alt="${prod.title}" class="product-image">
            </td>
            <td style="max-width: 400px; font-weight: bold;">${prod.title}</td>
            <td style="font-weight: bold; color: #111827;">${prod.price.toFixed(2)}€</td>
            <td><span style="background: #e0e7ff; color: #4f46e5; padding: 6px 12px; border-radius: 20px; font-size: 13px;">${prod.category}</span></td>
            <td>
                <div class="actions">
                    <button class="edit-btn" onclick="editProduct(${prod.id})">✏️ Editar</button>
                    <button class="delete-btn" onclick="deleteProduct(${prod.id})">🗑️ Eliminar</button>
                </div>
            </td>
        `;
        tableBody.appendChild(tr);
    });
}


function openModal() {
    const modalElement = document.getElementById("modal");
    if (modalElement) modalElement.classList.add("active");
}

function closeModal() {
    const modalElement = document.getElementById("modal");
    const form = document.getElementById("productForm");
    if (modalElement) modalElement.classList.remove("active");
    if (form) form.reset();
    editingId = null;
}

function createProduct() {
    const nuevoProducto = {
        id: products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1,
        title: document.getElementById("title").value,
        price: parseFloat(document.getElementById("price").value),
        image: document.getElementById("image").value || "https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500",
        category: document.getElementById("category").value
    };
    
    products.unshift(nuevoProducto);
    alert("¡Producto creado localmente con éxito!");
}

function editProduct(id) {
    const prod = products.find(p => p.id === id);
    if (!prod) return;

    editingId = id;
    
    const modalTitle = document.getElementById("modalTitle");
    if (modalTitle) modalTitle.textContent = "Editar Producto";

    document.getElementById("title").value = prod.title;
    document.getElementById("price").value = prod.price;
    document.getElementById("category").value = prod.category;
    document.getElementById("image").value = prod.image || "";

    openModal();
}

function updateProduct() {
    const index = products.findIndex(p => p.id === editingId);
    if (index !== -1) {
        products[index].title = document.getElementById("title").value;
        products[index].price = parseFloat(document.getElementById("price").value);
        products[index].category = document.getElementById("category").value;
        products[index].image = document.getElementById("image").value || "https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500";
        alert("¡Producto actualizado localmente con éxito!");
    }
}

function deleteProduct(id) {
    if (confirm("¿Seguro que deseas eliminar este producto permanentemente?")) {
        products = products.filter(p => p.id !== id);
        renderProducts();
        renderStats();
    }
}

// ===================================
// FILTROS 
// ===================================
function searchProducts() {
    renderProducts();
}

// ===================================
// ESTADÍSTICAS 
// ===================================
function renderStats() {
    const totalProductsEl = document.getElementById("totalProducts");
    if (totalProductsEl) totalProductsEl.textContent = products.length;

    const totalUsersEl = document.getElementById("totalUsers");
    if (totalUsersEl) totalUsersEl.textContent = "32"; 

    const totalOrdersEl = document.getElementById("totalOrders");
    if (totalOrdersEl) totalOrdersEl.textContent = "14";

    const totalSalesEl = document.getElementById("totalSales");
    if (totalSalesEl) {
        const inventarioTotal = products.reduce((sum, p) => sum + p.price, 0);
        totalSalesEl.textContent = `${inventarioTotal.toFixed(2)}€`;
    }
}

// ===================================
// EVENTOS 
// ===================================
function initEvents() {
    const inputSearch = document.getElementById("searchInput");
    if (inputSearch) inputSearch.addEventListener("input", searchProducts);

    const closeBtn = document.getElementById("closeModalBtn");
    if (closeBtn) closeBtn.addEventListener("click", closeModal);

    const modalElement = document.getElementById("modal");
    if (modalElement) {
        modalElement.addEventListener("click", (e) => {
            if (e.target === modalElement) closeModal();
        });
    }

    const addBtn = document.getElementById("addProductBtn");
    if (addBtn) {
        addBtn.addEventListener("click", () => {
            const modalTitle = document.getElementById("modalTitle");
            if (modalTitle) modalTitle.textContent = "Añadir Producto";
            openModal();
        });
    }

    const form = document.getElementById("productForm");
    if (form) {
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            
            if (editingId !== null) {
                updateProduct();
            } else {
                createProduct();
            }
            
            renderProducts();
            renderStats();
            closeModal();
        });
    }
}

// ===================================
// INIT 
// ===================================
function init() {
    getProducts();
    initEvents();
}

init();
</script>
</body>
</html>
